version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: posq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posq_server}
      POSTGRES_USER: ${POSTGRES_USER:-posq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posq_admin} -d ${POSTGRES_DB:-posq_server}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: posq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane-api:
    build:
      context: ./services/control-plane-api
      dockerfile: Dockerfile
    container_name: posq-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-posq_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-posq_server}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_this}
      LICENSE_SIGNING_KEY_PATH: /app/keys/license_private.pem
      UPDATE_SIGNING_KEY_PATH: /app/keys/update_private.pem
      RUST_LOG: ${RUST_LOG:-info}
      SERVER_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys

  control-plane-worker:
    build:
      context: ./services/control-plane-api
      dockerfile: Dockerfile.worker
    container_name: posq-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-posq_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-posq_server}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile
    container_name: posq-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      PUBLIC_API_URL: http://control-plane-api:3000
    depends_on:
      - control-plane-api

volumes:
  postgres_data:
  redis_data:
